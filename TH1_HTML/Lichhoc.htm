<!DOCTYPE html>
<html lang="vi">
<head>

  <title>Lịch Học</title>
  <style>
    h1 {
      font-size: 32px;
    }
    table, th {

      <tr>
        <td >LTWW</td>
        <td>LTW</td>
      </tr>
      <tr>
        <td rowspan="3">Chiều</td>
      </tr>
      <tr>
        <td>TDTT</td>
        <td>QTM</td>
        <td>TRR</td>

      <tr>
        <td colspan="2">AV</td>

</html>
