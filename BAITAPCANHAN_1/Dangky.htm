<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký</title>
</head>
<body>
  <center>
    <table border=1 cellpadding=10 cellspacing=0 frame="box" rules=none>
      <form>
        <tr>
          <td>Enter name:</td>
          <td>
            <input type="text" size=15>
          </td>
        </tr>
        <tr>
          <td>Enter password:</td>
          <td>
            <input type="password" size=15>
          </td>
        </tr>
        <tr>
          <td>Enter Email:</td>
          <td>
            <input type="text" size=15>
          </td>
        </tr>
        <tr>
          <td>Enter Gender:</td>
          <td>
            <label><input type="radio" name="gender">male</label>
            <label><input type="radio" name="gender">female</label>
          </td>
        </tr>
        <tr>
          <td>Select Country:</td>
          <td>
            <select>
              <option>Choosing a country</option>
              <option>Vietnam</option>
              <option>USA</option>
              <option>UK</option>
              <option>India</option>
              <option>Russia</option>
            </select>
          </td>
        </tr>
        <tr>
          <td align=right colspan="2"><input type="submit" value="register"></td>
        </tr>
      </form>
    </table>
  </center>
  
</body>
</html>
