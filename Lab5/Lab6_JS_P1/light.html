<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bóng đèn</title>
</head>
<body>
    <h2>Chương trình bật / tắt bóng đèn</h2>
    <img id="bulb" src="../images/bulboff.gif" alt="light" width="120px"><br><br>
    <button onclick="toggleLight()">On / Off</button>

    <script>
        function toggleLight() {
            let toggle = document.getElementById("bulb");
            if (toggle.src.includes("bulboff.gif")) {
                toggle.src = "../images/bulbon.gif";
            } else {
                toggle.src = "../images/bulboff.gif";
            }
        }
    </script>
</body>
</html>
