<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .tablelist {
            border-collapse: collapse;
            border: 1px solid blueviolet;
        }
        .tablelist th, td {
            padding: 5px;
            border: 1px solid black;
        }
        .tablelist th {
            background-color: blueviolet;
            color: white;
        }
        .tablelist tr:nth-child(even) {
            background: #fff;
        }
        .tablelist tr:nth-child(odd) {
            background: bisque;
        }
    </style>
</head>
<body>
    <h1>DANH SÁCH NHÂN VIÊN</h1>
    <table class="tablelist">
        <tr>
            <th>Số thứ tự</th>
            <th>Họ và tên</th>
            <th>Giới tính</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Trương Vô Kỵ</td>
            <td>Nam</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Triệu Mẫn</td>
            <td>Nữ</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Chu Chi Nhược</td>
            <td>Nam</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Kim Mao Sư Vương</td>
            <td>Nữ</td>
        </tr>
    </table>
</body>
</html>
