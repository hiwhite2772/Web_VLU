<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký</title>
</head>
<body>
    <table>
        <form>
            <tr>
                <td>First Name:</td>
                <td><input type="text" name="First Name" placeholder="Enter First Name"></td>
            </tr>
            <tr>
                <td>Last Name:</td>
                <td><input type="text" name="Last Name" placeholder="Enter Last Name"></td>
            </tr>
            <tr>
                <td>Email:</td>
                <td><input type="text" name="Email" placeholder="Enter Email"></td>
            </tr>
            <tr>
                <td>Password:</td>
                <td><input type="password" name="Password" placeholder="Enter Password"></td>
            </tr>
            <tr>
                <td>Gender:</td>
                <td>
                    <label><input type="radio" name="role">Male</label><br>
                    <label><input type="radio" name="role">Female</label><br>
                    <label><input type="radio" name="role">Other</label>                    
                </td>
            </tr>
            <tr>
                <td>Age:</td>
                <td>
                    <label><input type="number" min="1" max="100"></label>
                </td>
            </tr>
            <tr>
                <td>Preferences:</td>
                <td>
                    <label><input type="checkbox">Acrylic Painting</label><br>
                    <label><input type="checkbox">Oil Painting</label><br>
                    <labe><input type="checkbox">Water Color Painting</label>
                </td>
            </tr>
            <tr>
                <td>Select Occupation:</td>
                <td>
                    <select>
                        <option>Choose a occupation</option>
                        <option>Student</option>
                        <option>Lecturer</option>
                        <option>Employee</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Bio:</td>
                <td>
                    <textarea name="" id="" cols="21" rows="5" placeholder="Share few lines about yourself..."></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <label><input type="reset" value="RESET"></label>
                    <label><input type="submit" value="SUBMIT"></label>
                </td>
            </tr>
        </form>
    </table>
</body>
</html>
