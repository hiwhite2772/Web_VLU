<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nested Lists</title>
</head>
<body>
  <table border="2" width="20%">
    <tr>
      <th style="background-color: rgb(95, 212, 255);">Device</th>
      <th style="background-color: rgb(95, 212, 255);">Brand</th>
      <th style="background-color: rgb(95, 212, 255);" colspan="2">Specifications</th>
    </tr>
    <tr>
      <td rowspan="4">Smartphone</td>
      <td rowspan="4">Apple</td>
        <tr>
          <th style="background-color: rgb(255, 237, 117);">Model</th>
          <th style="background-color: rgb(255, 237, 117);">Storage</th>
        </tr>
        <tr>
          <td>iPhone 12 Pro</td>
          <td>256GB</td>
        </tr>
        <tr>
          <td>iPhone SE</td>
          <td>128GB</td>
        </tr>
    </tr>
    <tr>
      <td>Laptop</td>
      <td>HP</td>
      <td colspan="2">15.6" Display</td>
    </tr>
    <tr>
      <td>Tablet</td>
      <td>Samsung</td>
      <td colspan="2">10.5" Display</td>
    </tr>
  </table>
</body>
</html>
