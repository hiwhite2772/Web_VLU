<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chuyển độ nhiệt độ</title>
</head>

<body>
  <h3>Bài 13. Chuyển đổi nhiệt độ</h3>
  <label>Nhập nhiệt độ C: </label>
  <input type="number" id="doC" placeholder="Nhập độ C">
  <br><br>
  <button onclick="bai13()">Chuyển đổi</button>
  <p id="kq13"></p>
  <script>
    function bai13() {
      let doC = document.getElementById("doC").value;

      if (doC === "") {
        document.getElementById("kq13").innerHTML =
          "Vui lòng nhập nhiệt độ!";
        return;
      }

      let doF = (9 / 5) * Number(doC) + 32;

      document.getElementById("kq13").innerHTML =
        doC + "°C = " + doF.toFixed(2) + "°F";
    }
  </script>
</body>

</html>
