<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả học tập</title>
    <style>
        body {
            text-align: center ;
        }
        table {
            border-collapse: collapse;
            width: 500px;
            margin: 20px;
        }
        th, td {
            border: 1px solid #000;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>KẾT QUẢ HỌC TẬP</h2>
    <table border="1">
        <tr>
            <th colspan="5">KẾT QUẢ HỌC TẬP</th>
        </tr>
        <tr style="background-color: yellow;">
            <th rowspan="2">Họ và tên HS</th>
            <th colspan="2">Năm Sinh</th>
            <th rowspan="2">Điểm TB</th>
            <th rowspan="2">Xếp Loại</th>
        </tr>
        <tr style="background-color: yellow;">
            <th>Nam</th>
            <th>Nữ</th>
        </tr>
        <tr>
            <td style="text-align: left;">Lê Thanh Xuân</td>
            <td></td>
            <td>1988</td>
            <td>8.5</td>
            <td>Giỏi</td>
        </tr>
        <tr>
            <td style="text-align: left;">Phan Thế Hạ</td>
            <td>1990</td>
            <td></td>
            <td>6.5</td>
            <td>Khá</td>
        </tr>
        <tr>
            <td style="text-align: left;">Trần Hoài Thu</td>
            <td></td>
            <td>1991</td>
            <td>9.5</td>
            <td>Xuất sắc</td>
        </tr>
        <tr>
            <td style="text-align: left;">Trương Lưu Đông</td>
            <td>1989</td>
            <td></td>
            <td>6.0</td>
            <td>Trung Bình</td>
        </tr>
        <tr>
            <td style="text-align: left;">Nguyễn Trung Trực</td>
            <td>1988</td>
            <td></td>
            <td>4.5</td>
            <td>Kém</td>
        </tr>
        <tr style="background-color: yellow;">
            <td colspan="3">Tổng số học sinh đạt:</td>
            <td colspan="2">4 Học sinh</td>
        </tr>
    </table>
</body>
</html>
