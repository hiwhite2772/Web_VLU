<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM DỮ LIỆU</title>
</head>
<body>
    <h2>FORM DỮ LIỆU</h2>
    <table>
        <form>
            <tr>
                <td>Username:</td>
                <td><input type="text" placeholder="Enter username"></td>
            </tr>
            <tr>
                <td>Password:</td>
                <td><input type="password"></td>
            </tr>
            <tr>
                <td>Webserver</td>
                <td>
                    <select>
                        <option>Choose a server</option>
                        <option>VietNam</option>
                        <option>Russia</option>
                        <option>USA</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Choose a role:</td>
                <td>
                    <label><input type="radio" name="role">SE</label><br>
                    <label><input type="radio" name="role">DE</label><br>
                    <label><input type="radio" name="role">BE</label>
                </td>
            </tr>
            <tr>
                <td>Single sign-on:</td>
                <td>
                    <label><input type="checkbox">Mail</label><br>
                    <label><input type="checkbox">Zalo</label><br>
                    <label><input type="checkbox">Facebook</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label><input type="submit" value="Login"></label>
                    <label><input type="reset" value="Reset"></label>
                </td>
            </tr>
        </form>
    </table>
</body>
</html>
