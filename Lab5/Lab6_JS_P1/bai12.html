<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiểm tra năm nhuận</title>
</head>

<body>
  <h3>Bài 12. Kiểm tra năm nhuận</h3>
  <label>Nhập năm: </label>
  <input type="number" id="nam" placeholder="Nhập năm">
  <br><br>
  <button onclick="bai12()">Kiểm tra</button>
  <p id="kq12"></p>

  <script>
    function bai12() {
      let nam = Number(document.getElementById("nam").value);

      if (document.getElementById("nam").value === "" ||
        !Number.isInteger(nam) || nam <= 0) {
        document.getElementById("kq12").innerHTML =
          "Vui lòng nhập năm hợp lệ!";
      } else if (
        nam % 400 == 0 ||
        (nam % 4 == 0 && nam % 100 != 0)
      ) {
        document.getElementById("kq12").innerHTML =
          nam + " là năm nhuận";
      } else {
        document.getElementById("kq12").innerHTML =
          nam + " không phải là năm nhuận";
      }
    }
  </script>
</body>

</html>
